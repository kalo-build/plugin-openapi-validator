openapi: "3.1.0"
info:
  title: Test API
  version: 1.0.0
paths:
  /api/companies:
    get:
      operationId: list_Company
      tags:
        - Company
      summary: List companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
tags:
  - name: Company
    description: Operations on Company
