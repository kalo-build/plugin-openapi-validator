name: "@kalo-build/plugin-openapi-validator"
displayName: "OpenAPI Validator"
description: "Validates an OpenAPI 3.1 specification using libopenapi. Produces a validation report and fails the pipeline on errors."
version: "1.0.0"

input:
  format: "KA:OA1:YAML1"
  description: "OpenAPI 3.1 YAML specification"
  suggestedStore:
    name: "KA_OA_YAML"
    type: "localFileSystem"
    path: "./docs/openapi"

output:
  format: "KA:OA1:REPORT1"
  description: "Validation report (JSON)"
  suggestedStore:
    name: "KA_OA_REPORT"
    type: "localFileSystem"
    path: "./docs/openapi-report"

configSchema:
  specFileName:
    type: string
    description: "Name of the OpenAPI spec file to read (default: openapi.yaml)"
  failOnWarning:
    type: boolean
    description: "Fail the pipeline on warnings (default: false)"
  reportFileName:
    type: string
    description: "Output report file name (default: validation-report.json)"
